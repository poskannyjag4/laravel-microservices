openapi: 3.0.3
info:
  title: User Service API (Laravel)
  description: API управления пользователями.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api
    description: Local Server

paths:
  /users:
    get:
      summary: Получить список пользователей
      tags: [Users]
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Номер страницы
      responses:
        '200':
          description: Список пользователей с пагинацией
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollectionResponse'

    post:
      summary: Создать пользователя
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: Ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{id}:
    parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: ID пользователя

    get:
      summary: Получить одного пользователя
      tags: [Users]
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Обновить пользователя
      tags: [Users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Пользователь обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации

    delete:
      summary: Удалить пользователя
      tags: [Users]
      responses:
        '200':
          description: Пользователь удален
          content:
            application/json:
              schema:
                type: boolean
                example: true
        '404':
          description: Не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # --- Структура ресурса (Attributes) ---
    UserAttributes:
      type: object
      properties:
        name:
          type: string
          example: "Ivan Ivanov"
        email:
          type: string
          format: email
          example: "ivan@example.com"

    # --- Полный объект ресурса (JSON:API Style) ---
    UserResource:
      type: object
      properties:
        type:
          type: string
          example: "users"
        id:
          type: string # Или integer, зависит от БД, но в JSON:API id всегда строка
          example: "1"
        attributes:
          $ref: '#/components/schemas/UserAttributes'

    # --- Ответ для одного объекта (Laravel Resource wrap in 'data') ---
    UserSingleResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UserResource'

    # --- Ответ для списка (Laravel Collection) ---
    UserCollectionResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserResource'
        links:
          type: object
          properties:
            first: { type: string, nullable: true }
            last: { type: string, nullable: true }
            prev: { type: string, nullable: true }
            next: { type: string, nullable: true }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            from: { type: integer, nullable: true }
            last_page: { type: integer }
            path: { type: string }
            per_page: { type: integer }
            to: { type: integer, nullable: true }
            total: { type: integer }

    # --- Тела запросов (Request Body) ---
    UserCreateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string # Предполагаю, что при создании нужен пароль?
      required:
        - name
        - email

    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
      # В update обычно поля не required, так как можно обновить только часть

    # --- Ошибки ---
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Пользователя с id 99 не существует"

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "The email has already been taken."
